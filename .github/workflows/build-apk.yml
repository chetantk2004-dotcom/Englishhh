name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug signing keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Prepare Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "Using committed app/google-services.json"
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Restoring app/google-services.json from GOOGLE_SERVICES_JSON secret"
            python3 - <<'EOF'
          import base64, json, os, sys
          raw = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()
          if not raw:
              sys.exit(1)
          try:
              json.loads(raw)
              content = raw
          except Exception:
              decoded = base64.b64decode("".join(raw.split())).decode("utf-8")
              json.loads(decoded)
              content = decoded
          with open("app/google-services.json", "w", encoding="utf-8") as f:
              f.write(content)
          print("Successfully wrote valid app/google-services.json")
          EOF
          else
            echo "::error::Missing app/google-services.json. Download google-services.json from Firebase Console (project: gen-lang-client-0585798077, package: com.aistudio.englishseekhen.kxmpqz) and either commit it to app/google-services.json or add it as a GitHub Actions secret named GOOGLE_SERVICES_JSON."
            exit 1
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify Debug APK exists
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Debug APK not found under app/build/outputs/apk/debug"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish Debug APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build-${{ github.run_number }}
          name: "Debug APK — Build #${{ github.run_number }}"
          body: |
            Automated debug APK build from commit `${{ github.sha }}` on branch `${{ github.ref_name }}`.

            **Download on Android:** Tap the `.apk` asset below to download and install this debug build on your phone.
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
